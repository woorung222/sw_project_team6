---
- name: "U_62 | Set Login Warning Banners for Services (Controlled Env, Controller-Only Logs+JSON, Stream-Split, UTF8-safe, Host-Split)"
  hosts: all
  become: yes
  gather_facts: no

  vars:
    FLAG_ID: "U_62"

    # 대상 파일
    issue_file: "/etc/issue"
    motd_file: "/etc/motd"
    issue_net_file: "/etc/issue.net"

    sshd_config: "/etc/ssh/sshd_config"
    sendmail_cf: "/etc/mail/sendmail.cf"
    postfix_main_cf: "/etc/postfix/main.cf"

    exim_conf_candidates:
      - "/etc/exim/exim.conf"
      - "/etc/exim4/exim4.conf"
      - "/etc/exim.conf"

    vsftpd_conf_candidates:
      - "/etc/vsftpd.conf"
      - "/etc/vsftpd/vsftpd.conf"

    proftpd_conf_candidates:
      - "/etc/proftpd/proftpd.conf"
      - "/etc/proftpd.conf"

    named_conf_candidates:
      - "/etc/named.conf"
      - "/etc/bind/named.conf.options"
      - "/etc/bind/named.conf"

    # systemd 서비스명(실패 허용)
    svc_sshd: "sshd"
    svc_postfix: "postfix"
    svc_vsftpd: "vsftpd"
    svc_proftpd: "proftpd"
    svc_named: "named"
    svc_exim4: "exim4"
    svc_exim: "exim"

    # timestamp formats (controller side)
    TS_STDERR_CMD: "date -u +%Y-%m-%dT%H:%M:%SZ"
    TS_STDOUT_CMD: "date +%Y_%m_%d' / '%H:%M:%S"

    # [팀 조건] log/json 경로 및 파일명 (host-split + scan 제거)
    log_dir: "{{ isms_remediate_log_dir | default('/tmp') }}"
    json_dir: "{{ isms_remediate_json_dir | default('/tmp') }}"
    FILE_HOST: "{{ inventory_hostname | regex_replace('(-scan)$', '') }}"
    my_log_file: "{{ log_dir }}/{{ FILE_HOST }}-remediate_{{ FLAG_ID }}.log"
    my_json_file: "{{ json_dir }}/{{ FILE_HOST }}-remediate_{{ FLAG_ID }}.json"

    # (입력) 배너 문자열: -e banner_text="..."
    # 미제공 시: 수동조치(팀 조건)
    banner_text_effective: ""

  tasks:
    # ---------------------------------------------------------
    # (공통) init + 입력값 정규화 + meta 수집
    # ---------------------------------------------------------
    - name: "U_62 | init defaults"
      ansible.builtin.set_fact:
        META_HOSTNAME: ""
        META_IP: ""
        META_USER: ""

        ready_banner: false
        banner_text_effective: ""

        exim_conf: ""
        vsftpd_conf: ""
        proftpd_conf: ""
        named_conf: ""

        # register 초기화(미정의 방지)
        r_u621: {}
        r_u622: {}
        r_u623: {}
        r_u624: {}
        r_u625: {}
        r_u626: {}
        r_u627: {}
        r_u628: {}
        r_u629: {}

        # status/desc/result
        u621_status: 0
        u621_desc: ""
        u621_result: ""

        u622_status: 0
        u622_desc: ""
        u622_result: ""

        u623_status: 0
        u623_desc: ""
        u623_result: ""

        u624_status: 0
        u624_desc: ""
        u624_result: ""

        u625_status: 0
        u625_desc: ""
        u625_result: ""

        u626_status: 0
        u626_desc: ""
        u626_result: ""

        u627_status: 0
        u627_desc: ""
        u627_result: ""

        u628_status: 0
        u628_desc: ""
        u628_result: ""

        u629_status: 0
        u629_desc: ""
        u629_result: ""
      changed_when: false

    - name: "U_62 | normalize input"
      ansible.builtin.set_fact:
        banner_text_effective: "{{ (banner_text | default('')) | string }}"
        ready_banner: "{{ ((banner_text | default('')) | string | length) > 0 }}"
      changed_when: false

    - name: "U_62 | meta | hostname"
      ansible.builtin.command: "hostname"
      register: m_host
      changed_when: false

    - name: "U_62 | meta | ip"
      ansible.builtin.shell: "hostname -I | awk '{print $1}'"
      register: m_ip
      changed_when: false

    - name: "U_62 | meta | user"
      ansible.builtin.command: "whoami"
      register: m_user
      changed_when: false

    - name: "U_62 | meta | set_fact"
      ansible.builtin.set_fact:
        META_HOSTNAME: "{{ m_host.stdout | default('') }}"
        META_IP: "{{ m_ip.stdout | default('') }}"
        META_USER: "{{ m_user.stdout | default('') }}"
      changed_when: false

    # ---------------------------------------------------------
    # (공통) conf 파일 선택(존재하는 첫 번째)
    # ---------------------------------------------------------
    - name: "U_62 | select exim conf"
      ansible.builtin.shell: |
        for p in {{ exim_conf_candidates | join(' ') }}; do
          [ -f "$p" ] && echo "$p" && exit 0
        done
        exit 0
      register: r_exim_sel
      changed_when: false
      failed_when: false

    - name: "U_62 | select vsftpd conf"
      ansible.builtin.shell: |
        for p in {{ vsftpd_conf_candidates | join(' ') }}; do
          [ -f "$p" ] && echo "$p" && exit 0
        done
        exit 0
      register: r_vs_sel
      changed_when: false
      failed_when: false

    - name: "U_62 | select proftpd conf"
      ansible.builtin.shell: |
        for p in {{ proftpd_conf_candidates | join(' ') }}; do
          [ -f "$p" ] && echo "$p" && exit 0
        done
        exit 0
      register: r_pf_sel
      changed_when: false
      failed_when: false

    - name: "U_62 | select named conf"
      ansible.builtin.shell: |
        for p in {{ named_conf_candidates | join(' ') }}; do
          [ -f "$p" ] && echo "$p" && exit 0
        done
        exit 0
      register: r_nd_sel
      changed_when: false
      failed_when: false

    - name: "U_62 | set_fact selected paths"
      ansible.builtin.set_fact:
        exim_conf: "{{ r_exim_sel.stdout | default('') }}"
        vsftpd_conf: "{{ r_vs_sel.stdout | default('') }}"
        proftpd_conf: "{{ r_pf_sel.stdout | default('') }}"
        named_conf: "{{ r_nd_sel.stdout | default('') }}"
      changed_when: false

    # =========================================================
    # U_62_1) [Server] /etc/motd, /etc/issue 배너 내용 설정
    # =========================================================
    - name: "U_62 | [U_62_1] set /etc/motd and /etc/issue banner"
      block:
        - name: "U_62_1 | write /etc/motd"
          ansible.builtin.copy:
            dest: "{{ motd_file }}"
            content: "{{ banner_text_effective }}\n"
            owner: "root"
            group: "root"
            mode: "0644"
          register: r_motd
          failed_when: false
          when: ready_banner | bool

        - name: "U_62_1 | write /etc/issue"
          ansible.builtin.copy:
            dest: "{{ issue_file }}"
            content: "{{ banner_text_effective }}\n"
            owner: "root"
            group: "root"
            mode: "0644"
          register: r_issue
          failed_when: false
          when: ready_banner | bool

        - name: "U_62_1 | compute"
          ansible.builtin.set_fact:
            u621_status: "{{ (ready_banner | bool) | ternary(2, 0) }}"
            u621_desc: "{{ (ready_banner | bool) | ternary('/etc/motd 및 /etc/issue 배너를 설정했습니다', 'banner_text 미제공으로 수동조치로 전환했습니다') }}"
            u621_result: "{{ ((ready_banner | bool)) | ternary('조치 성공 (status: 2)', '조치 불가 (status: 0)') }}"
          changed_when: false

        - name: "U_62_1 | emit stderr log JSON"
          delegate_to: localhost
          become: false
          ansible.builtin.shell: >
            printf '%s\n' '{{ {
              "ts": (ts.stderr_ts | default("")),
              "flag_id": "U_62_1",
              "section": "서버 배너(/etc/motd,/etc/issue) 설정",
              "title": "[U_62_1] 서버 로그인 배너 설정",
              "cmd": "write banner_text to /etc/motd and /etc/issue",
              "result": u621_result
            } | to_json }}'
            | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin), ensure_ascii=False))'
            | tee -a '{{ my_log_file }}' 1>&2
          vars:
            ts:
              stderr_ts: "{{ lookup('pipe', TS_STDERR_CMD) }}"
          changed_when: false

        - name: "U_62_1 | emit stdout result JSON"
          delegate_to: localhost
          become: false
          ansible.builtin.shell: >
            printf '%s\n' '{{ {
              "meta": {"hostname": META_HOSTNAME, "ip": META_IP, "user": META_USER},
              "result": {
                "flag_id": "U_62_1",
                "status": (u621_status | int),
                "description": u621_desc,
                "category": "service",
                "timestamp": (ts.stdout_ts | default(""))
              }
            } | to_json }}'
            | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin), ensure_ascii=False))'
            | tee -a '{{ my_json_file }}'
          vars:
            ts:
              stdout_ts: "{{ lookup('pipe', TS_STDOUT_CMD) }}"
          changed_when: false
      when:
        - "'U_62_1' in (flag_list | default([]))"

    # =========================================================
    # U_62_2) [Telnet] /etc/issue.net 배너 내용 설정
    # =========================================================
    - name: "U_62 | [U_62_2] set /etc/issue.net banner"
      block:
        - name: "U_62_2 | write /etc/issue.net"
          ansible.builtin.copy:
            dest: "{{ issue_net_file }}"
            content: "{{ banner_text_effective }}\n"
            owner: "root"
            group: "root"
            mode: "0644"
          register: r_issue_net
          failed_when: false
          when: ready_banner | bool

        - name: "U_62_2 | compute"
          ansible.builtin.set_fact:
            u622_status: "{{ (ready_banner | bool) | ternary(2, 0) }}"
            u622_desc: "{{ (ready_banner | bool) | ternary('/etc/issue.net 배너를 설정했습니다', 'banner_text 미제공으로 수동조치로 전환했습니다') }}"
            u622_result: "{{ ((ready_banner | bool)) | ternary('조치 성공 (status: 2)', '조치 불가 (status: 0)') }}"
          changed_when: false

        - name: "U_62_2 | emit stderr log JSON"
          delegate_to: localhost
          become: false
          ansible.builtin.shell: >
            printf '%s\n' '{{ {
              "ts": (ts.stderr_ts | default("")),
              "flag_id": "U_62_2",
              "section": "Telnet 배너(/etc/issue.net) 설정",
              "title": "[U_62_2] Telnet 배너 설정",
              "cmd": "write banner_text to /etc/issue.net",
              "result": u622_result
            } | to_json }}'
            | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin), ensure_ascii=False))'
            | tee -a '{{ my_log_file }}' 1>&2
          vars:
            ts:
              stderr_ts: "{{ lookup('pipe', TS_STDERR_CMD) }}"
          changed_when: false

        - name: "U_62_2 | emit stdout result JSON"
          delegate_to: localhost
          become: false
          ansible.builtin.shell: >
            printf '%s\n' '{{ {
              "meta": {"hostname": META_HOSTNAME, "ip": META_IP, "user": META_USER},
              "result": {
                "flag_id": "U_62_2",
                "status": (u622_status | int),
                "description": u622_desc,
                "category": "service",
                "timestamp": (ts.stdout_ts | default(""))
              }
            } | to_json }}'
            | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin), ensure_ascii=False))'
            | tee -a '{{ my_json_file }}'
          vars:
            ts:
              stdout_ts: "{{ lookup('pipe', TS_STDOUT_CMD) }}"
          changed_when: false
      when:
        - "'U_62_2' in (flag_list | default([]))"

    # =========================================================
    # U_62_3) [SSH] sshd_config Banner 설정 + sshd 재시작(변경 시)
    # =========================================================
    - name: "U_62 | [U_62_3] set SSH Banner and restart sshd"
      block:
        - name: "U_62_3 | ensure /etc/issue.net written"
          ansible.builtin.copy:
            dest: "{{ issue_net_file }}"
            content: "{{ banner_text_effective }}\n"
            owner: "root"
            group: "root"
            mode: "0644"
          register: r_u623_issue
          failed_when: false
          when: ready_banner | bool

        - name: "U_62_3 | set sshd_config Banner"
          ansible.builtin.lineinfile:
            path: "{{ sshd_config }}"
            regexp: '^[[:space:]]*Banner[[:space:]]+'
            line: "Banner {{ issue_net_file }}"
            backup: yes
          register: r_u623_banner
          failed_when: false
          when: ready_banner | bool

        - name: "U_62_3 | restart sshd (only when changed)"
          ansible.builtin.systemd:
            name: "{{ svc_sshd }}"
            state: restarted
          register: r_u623_restart
          failed_when: false
          when:
            - ready_banner | bool
            - ((r_u623_banner.changed | default(false)) | bool)

        - name: "U_62_3 | compute"
          ansible.builtin.set_fact:
            u623_status: "{{ (ready_banner | bool) | ternary(2, 0) }}"
            u623_desc: "{{ (ready_banner | bool) | ternary('SSH Banner를 설정했습니다(변경 시 sshd 재시작)', 'banner_text 미제공으로 수동조치로 전환했습니다') }}"
            u623_result: "{{ ((ready_banner | bool)) | ternary('조치 성공 (status: 2)', '조치 불가 (status: 0)') }}"
          changed_when: false

        - name: "U_62_3 | emit stderr log JSON"
          delegate_to: localhost
          become: false
          ansible.builtin.shell: >
            printf '%s\n' '{{ {
              "ts": (ts.stderr_ts | default("")),
              "flag_id": "U_62_3",
              "section": "SSH Banner 설정(Banner {{ issue_net_file }}) 및 sshd 재시작(변경 시)",
              "title": "[U_62_3] SSH 배너 설정",
              "cmd": "write /etc/issue.net; set Banner in sshd_config; systemctl restart sshd(변경 시)",
              "result": u623_result
            } | to_json }}'
            | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin), ensure_ascii=False))'
            | tee -a '{{ my_log_file }}' 1>&2
          vars:
            ts:
              stderr_ts: "{{ lookup('pipe', TS_STDERR_CMD) }}"
          changed_when: false

        - name: "U_62_3 | emit stdout result JSON"
          delegate_to: localhost
          become: false
          ansible.builtin.shell: >
            printf '%s\n' '{{ {
              "meta": {"hostname": META_HOSTNAME, "ip": META_IP, "user": META_USER},
              "result": {
                "flag_id": "U_62_3",
                "status": (u623_status | int),
                "description": u623_desc,
                "category": "service",
                "timestamp": (ts.stdout_ts | default(""))
              }
            } | to_json }}'
            | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin), ensure_ascii=False))'
            | tee -a '{{ my_json_file }}'
          vars:
            ts:
              stdout_ts: "{{ lookup('pipe', TS_STDOUT_CMD) }}"
          changed_when: false
      when:
        - "'U_62_3' in (flag_list | default([]))"

    # =========================================================
    # U_62_4) [Sendmail] SmtpGreetingMessage 설정
    # - sendmail.cf 문법은 환경별 차이가 있어 실패 허용(수동조치 전환)
    # =========================================================
    - name: "U_62 | [U_62_4] set Sendmail SmtpGreetingMessage"
      block:
        - name: "U_62_4 | set SmtpGreetingMessage in sendmail.cf"
          ansible.builtin.lineinfile:
            path: "{{ sendmail_cf }}"
            regexp: '^[[:space:]]*O[[:space:]]+SmtpGreetingMessage='
            line: "O SmtpGreetingMessage={{ banner_text_effective }}"
            backup: yes
          register: r_u624_sm
          failed_when: false
          when: ready_banner | bool

        - name: "U_62_4 | compute"
          ansible.builtin.set_fact:
            u624_status: "{{ (ready_banner | bool) | ternary(2, 0) }}"
            u624_desc: "{{ (ready_banner | bool) | ternary('Sendmail SmtpGreetingMessage 설정을 시도했습니다(환경에 따라 담당자 확인 필요)', 'banner_text 미제공으로 수동조치로 전환했습니다') }}"
            u624_result: "{{ ((ready_banner | bool)) | ternary('조치 성공 (status: 2)', '조치 불가 (status: 0)') }}"
          changed_when: false

        - name: "U_62_4 | emit stderr log JSON"
          delegate_to: localhost
          become: false
          ansible.builtin.shell: >
            printf '%s\n' '{{ {
              "ts": (ts.stderr_ts | default("")),
              "flag_id": "U_62_4",
              "section": "Sendmail SmtpGreetingMessage 설정",
              "title": "[U_62_4] Sendmail 배너 설정",
              "cmd": "set 'O SmtpGreetingMessage=<banner>' in /etc/mail/sendmail.cf",
              "result": u624_result
            } | to_json }}'
            | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin), ensure_ascii=False))'
            | tee -a '{{ my_log_file }}' 1>&2
          vars:
            ts:
              stderr_ts: "{{ lookup('pipe', TS_STDERR_CMD) }}"
          changed_when: false

        - name: "U_62_4 | emit stdout result JSON"
          delegate_to: localhost
          become: false
          ansible.builtin.shell: >
            printf '%s\n' '{{ {
              "meta": {"hostname": META_HOSTNAME, "ip": META_IP, "user": META_USER},
              "result": {
                "flag_id": "U_62_4",
                "status": (u624_status | int),
                "description": u624_desc,
                "category": "service",
                "timestamp": (ts.stdout_ts | default(""))
              }
            } | to_json }}'
            | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin), ensure_ascii=False))'
            | tee -a '{{ my_json_file }}'
          vars:
            ts:
              stdout_ts: "{{ lookup('pipe', TS_STDOUT_CMD) }}"
          changed_when: false
      when:
        - "'U_62_4' in (flag_list | default([]))"

    # =========================================================
    # U_62_5) [Postfix] smtpd_banner 설정 + 재시작(변경 시)
    # =========================================================
    - name: "U_62 | [U_62_5] set Postfix smtpd_banner and restart"
      block:
        - name: "U_62_5 | set postfix smtpd_banner"
          ansible.builtin.lineinfile:
            path: "{{ postfix_main_cf }}"
            regexp: '^[[:space:]]*smtpd_banner[[:space:]]*='
            line: "smtpd_banner = {{ banner_text_effective }}"
            backup: yes
          register: r_u625_pf
          failed_when: false
          when: ready_banner | bool

        - name: "U_62_5 | restart postfix (only when changed)"
          ansible.builtin.systemd:
            name: "{{ svc_postfix }}"
            state: restarted
          register: r_u625_restart
          failed_when: false
          when:
            - ready_banner | bool
            - ((r_u625_pf.changed | default(false)) | bool)

        - name: "U_62_5 | compute"
          ansible.builtin.set_fact:
            u625_status: "{{ (ready_banner | bool) | ternary(2, 0) }}"
            u625_desc: "{{ (ready_banner | bool) | ternary('Postfix smtpd_banner를 설정했습니다(변경 시 postfix 재시작)', 'banner_text 미제공으로 수동조치로 전환했습니다') }}"
            u625_result: "{{ ((ready_banner | bool)) | ternary('조치 성공 (status: 2)', '조치 불가 (status: 0)') }}"
          changed_when: false

        - name: "U_62_5 | emit stderr log JSON"
          delegate_to: localhost
          become: false
          ansible.builtin.shell: >
            printf '%s\n' '{{ {
              "ts": (ts.stderr_ts | default("")),
              "flag_id": "U_62_5",
              "section": "Postfix smtpd_banner 설정 및 postfix 재시작(변경 시)",
              "title": "[U_62_5] Postfix 배너 설정",
              "cmd": "set smtpd_banner in /etc/postfix/main.cf; systemctl restart postfix(변경 시)",
              "result": u625_result
            } | to_json }}'
            | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin), ensure_ascii=False))'
            | tee -a '{{ my_log_file }}' 1>&2
          vars:
            ts:
              stderr_ts: "{{ lookup('pipe', TS_STDERR_CMD) }}"
          changed_when: false

        - name: "U_62_5 | emit stdout result JSON"
          delegate_to: localhost
          become: false
          ansible.builtin.shell: >
            printf '%s\n' '{{ {
              "meta": {"hostname": META_HOSTNAME, "ip": META_IP, "user": META_USER},
              "result": {
                "flag_id": "U_62_5",
                "status": (u625_status | int),
                "description": u625_desc,
                "category": "service",
                "timestamp": (ts.stdout_ts | default(""))
              }
            } | to_json }}'
            | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin), ensure_ascii=False))'
            | tee -a '{{ my_json_file }}'
          vars:
            ts:
              stdout_ts: "{{ lookup('pipe', TS_STDOUT_CMD) }}"
          changed_when: false
      when:
        - "'U_62_5' in (flag_list | default([]))"

    # =========================================================
    # U_62_6) [Exim] smtp_banner 설정 + 재시작(변경 시)
    # =========================================================
    - name: "U_62 | [U_62_6] set Exim smtp_banner and restart"
      block:
        - name: "U_62_6 | set exim smtp_banner"
          ansible.builtin.lineinfile:
            path: "{{ exim_conf }}"
            regexp: '^[[:space:]]*smtp_banner[[:space:]]*='
            line: "smtp_banner = {{ banner_text_effective }}"
            insertafter: EOF
            backup: yes
          register: r_u626_ex
          failed_when: false
          when:
            - ready_banner | bool
            - (exim_conf | length > 0)

