        - name: "U_66_4 | compute"
          ansible.builtin.set_fact:
            u66_status: "{{ (((r_u664_dir.failed | default(false)) | bool) or ((r_u664_line.failed | default(false)) | bool)) | ternary(0, 2) }}"
