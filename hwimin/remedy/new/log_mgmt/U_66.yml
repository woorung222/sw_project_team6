---
- name: "U_66 | System Logging Policy (rsyslog) (Controlled Env, Controller-Only Logs+JSON, Stream-Split, UTF8-safe, Host-Split)"
  hosts: all
  become: yes
  gather_facts: no

  vars:
    FLAG_ID: "U_66"

    # rsyslog drop-in (보수적: 기존 rsyslog.conf 직접 덮지 않음)
    rsyslog_dropin_dir: "/etc/rsyslog.d"
    rsyslog_dropin_file: "/etc/rsyslog.d/99-isms-u66.conf"
    svc_rsyslog: "rsyslog"

    # U-66 정책(캡처 표 기반)
    line_secure:   "auth,authpriv.*                            /var/log/secure"
    line_messages: "*.info;mail.none;authpriv.none;cron.none    /var/log/messages"
    line_cron:     "cron.*                                     /var/log/cron"
    line_maillog:  "mail.*                                     /var/log/maillog"
    # (참고용)
    line_alert:    "*.alert                                    /dev/console"
    line_emerg:    "*.emerg                                    *"

    # timestamp (controller side)
    TS_STDERR_CMD: "date -u +%Y-%m-%dT%H:%M:%SZ"
    TS_STDOUT_CMD: "date +%Y_%m_%d' / '%H:%M:%S"

    # team paths
    log_dir: "{{ isms_remediate_log_dir | default('/tmp') }}"
    json_dir: "{{ isms_remediate_json_dir | default('/tmp') }}"

  tasks:
    # ---------------------------------------------------------
    # init defaults
    # ---------------------------------------------------------
    - name: "U_66 | init defaults"
      ansible.builtin.set_fact:
        META_HOSTNAME: ""
        META_IP: ""
        META_USER: ""

        FILE_HOST: "{{ inventory_hostname | regex_replace('(-scan)$', '') }}"
        my_log_file: ""
        my_json_file: ""

        # 공용 결과 변수(블록마다 덮어씀)
        u66_status: 0
        u66_desc: ""
        u66_result: ""
        u66_cmd: ""
      changed_when: false

    # ---------------------------------------------------------
    # meta (stdout json meta + host file naming)
    # ---------------------------------------------------------
    - name: "U_66 | meta | hostname"
      ansible.builtin.command: "hostname"
      register: m_host
      changed_when: false

    - name: "U_66 | meta | ip"
      ansible.builtin.shell: "hostname -I | awk '{print $1}'"
      register: m_ip
      changed_when: false

    - name: "U_66 | meta | user"
      ansible.builtin.command: "whoami"
      register: m_user
      changed_when: false

    - name: "U_66 | meta | set_fact"
      ansible.builtin.set_fact:
        META_HOSTNAME: "{{ m_host.stdout | default('') }}"
        META_IP: "{{ m_ip.stdout | default('') }}"
        META_USER: "{{ m_user.stdout | default('') }}"
        FILE_HOST: >-
          {{
            (m_host.stdout | default('') | trim)
            | regex_replace('-scan$', '')
            | regex_replace('-controller$', '')
            | default(inventory_hostname)
          }}
      changed_when: false

    - name: "U_66 | set log/json file path (host-split)"
      ansible.builtin.set_fact:
        my_log_file: "{{ log_dir }}/{{ FILE_HOST }}-remediate_{{ FLAG_ID }}.log"
        my_json_file: "{{ json_dir }}/{{ FILE_HOST }}-remediate_{{ FLAG_ID }}.json"
      changed_when: false

    # =========================================================
    # U_66_1 : rsyslog 패키지/서비스 활성 보장
    # =========================================================
    - name: "U_66 | [U_66_1] ensure rsyslog installed and active + logs/json"
      block:
        - name: "U_66_1 | cmd"
          ansible.builtin.set_fact:
            u66_cmd: "package install rsyslog; systemctl enable --now rsyslog"
          changed_when: false

        - name: "U_66_1 | install rsyslog"
          ansible.builtin.package:
            name: "rsyslog"
            state: present
          register: r_u661_pkg
          failed_when: false

        - name: "U_66_1 | enable/start rsyslog"
          ansible.builtin.systemd:
            name: "{{ svc_rsyslog }}"
            enabled: true
            state: started
          register: r_u661_svc
          failed_when: false

        - name: "U_66_1 | compute"
          ansible.builtin.set_fact:
            u66_status: "{{ (((r_u661_pkg.failed | default(false)) | bool) or ((r_u661_svc.failed | default(false)) | bool)) | ternary(0, 2) }}"
            u66_desc: >-
              {{
                (((r_u661_pkg.failed | default(false)) | bool) or ((r_u661_svc.failed | default(false)) | bool))
                | ternary(
                    "rsyslog 설치 또는 서비스 활성화에 실패하여 수동조치로 전환했습니다",
                    "rsyslog 패키지를 설치/확인하고 서비스를 활성화했습니다"
                  )
              }}
            u66_result: "{{ ((u66_status | int) == 2) | ternary('조치 성공 (status: 2)', '조치 불가 (status: 0)') }}"
          changed_when: false

        - name: "U_66_1 | emit stderr log JSON"
          delegate_to: localhost
          become: false
          ansible.builtin.shell: |
            printf '%s\n' '{{ {
              "ts": (ts_e | default("")),
              "flag_id": "U_66_1",
              "section": "rsyslog 패키지 설치/확인 및 서비스 활성화/기동 적용",
              "title": "[U_66_1] rsyslog 설치 및 서비스 활성화",
              "cmd": u66_cmd,
              "result": u66_result
            } | to_json }}' \
            | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin), ensure_ascii=False))' \
            | tee -a '{{ my_log_file }}' 1>&2
          vars:
            ts_e: "{{ lookup('pipe', TS_STDERR_CMD) }}"
          changed_when: false

        - name: "U_66_1 | emit stdout result JSON"
          delegate_to: localhost
          become: false
          ansible.builtin.shell: |
            printf '%s\n' '{{ {
              "meta": {"hostname": META_HOSTNAME, "ip": META_IP, "user": META_USER},
              "result": {
                "flag_id": "U_66_1",
                "status": (u66_status | int),
                "description": (u66_desc | string),
                "category": "log",
                "timestamp": (ts_o | default(""))
              }
            } | to_json }}' \
            | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin), ensure_ascii=False))' \
            | tee -a '{{ my_json_file }}'
          vars:
            ts_o: "{{ lookup('pipe', TS_STDOUT_CMD) }}"
          changed_when: false
      when:
        - "'U_66_1' in (flag_list | default([]))"

    # =========================================================
    # U_66_2 : authpriv.* -> /var/log/secure
    # =========================================================
    - name: "U_66 | [U_66_2] secure(authpriv) policy + logs/json"
      block:
        - name: "U_66_2 | cmd"
          ansible.builtin.set_fact:
            u66_cmd: "ensure authpriv.* -> /var/log/secure (drop-in); systemctl reload rsyslog (fallback restart)"
          changed_when: false

        - name: "U_66_2 | ensure drop-in dir"
          ansible.builtin.file:
            path: "{{ rsyslog_dropin_dir }}"
            state: directory
            owner: "root"
            group: "root"
            mode: "0755"
          register: r_u662_dir
          failed_when: false

        - name: "U_66_2 | write secure line"
          ansible.builtin.lineinfile:
            path: "{{ rsyslog_dropin_file }}"
            create: true
            owner: "root"
            group: "root"
            mode: "0644"
            regexp: '^[[:space:]]*auth,authpriv\.\*[[:space:]]+\/var\/log\/secure[[:space:]]*$'
            line: "{{ line_secure }}"
            insertafter: EOF
          register: r_u662_line
          failed_when: false

        - name: "U_66_2 | reload rsyslog when changed"
          ansible.builtin.systemd:
            name: "{{ svc_rsyslog }}"
            state: reloaded
          register: r_u662_reload
          failed_when: false
          when: (r_u662_line.changed | default(false)) | bool

        - name: "U_66_2 | restart rsyslog when reload failed"
          ansible.builtin.systemd:
            name: "{{ svc_rsyslog }}"
            state: restarted
          register: r_u662_restart
          failed_when: false
          when:
            - (r_u662_line.changed | default(false)) | bool
            - (r_u662_reload.failed | default(false)) | bool

        - name: "U_66_2 | compute"
          ansible.builtin.set_fact:
            u66_status: "{{ (((r_u662_dir.failed | default(false)) | bool) or ((r_u662_line.failed | default(false)) | bool)) | ternary(0, 2) }}"
            u66_desc: >-
              {{
                (((r_u662_dir.failed | default(false)) | bool) or ((r_u662_line.failed | default(false)) | bool))
                | ternary(
                    "secure 로그 정책(authpriv.* → /var/log/secure) 반영에 실패하여 수동조치로 전환했습니다",
                    "secure 로그 정책(authpriv.* → /var/log/secure)을 반영했습니다"
                  )
              }}
            u66_result: "{{ ((u66_status | int) == 2) | ternary('조치 성공 (status: 2)', '조치 불가 (status: 0)') }}"
          changed_when: false

        - name: "U_66_2 | emit stderr log JSON"
          delegate_to: localhost
          become: false
          ansible.builtin.shell: |
            printf '%s\n' '{{ {
              "ts": (ts_e | default("")),
              "flag_id": "U_66_2",
              "section": "authpriv 로그를 /var/log/secure로 기록하도록 rsyslog 정책(drop-in) 반영",
              "title": "[U_66_2] secure(authpriv) 로그 정책 설정",
              "cmd": u66_cmd,
              "result": u66_result
            } | to_json }}' \
            | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin), ensure_ascii=False))' \
            | tee -a '{{ my_log_file }}' 1>&2
          vars:
            ts_e: "{{ lookup('pipe', TS_STDERR_CMD) }}"
          changed_when: false

        - name: "U_66_2 | emit stdout result JSON"
          delegate_to: localhost
          become: false
          ansible.builtin.shell: |
            printf '%s\n' '{{ {
              "meta": {"hostname": META_HOSTNAME, "ip": META_IP, "user": META_USER},
              "result": {
                "flag_id": "U_66_2",
                "status": (u66_status | int),
                "description": (u66_desc | string),
                "category": "log",
                "timestamp": (ts_o | default(""))
              }
            } | to_json }}' \
            | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin), ensure_ascii=False))' \
            | tee -a '{{ my_json_file }}'
          vars:
            ts_o: "{{ lookup('pipe', TS_STDOUT_CMD) }}"
          changed_when: false
      when:
        - "'U_66_2' in (flag_list | default([]))"

    # =========================================================
    # U_66_3 : *.info... -> /var/log/messages
