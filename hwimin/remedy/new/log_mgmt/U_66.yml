            regexp: '^[[:space:]]*\*\.info;mail\.none;authpriv\.none;cron\.none[[:space:]]+\/var\/log\/messages[[:space:]]*$'
            line: "{{ line_messages }}"
            insertafter: EOF
          register: r_u663_line
          failed_when: false

        - name: "U_66_3 | reload rsyslog when changed"
          ansible.builtin.systemd:
            name: "{{ svc_rsyslog }}"
            state: reloaded
          register: r_u663_reload
          failed_when: false
          when: (r_u663_line.changed | default(false)) | bool

        - name: "U_66_3 | restart rsyslog when reload failed"
          ansible.builtin.systemd:
            name: "{{ svc_rsyslog }}"
            state: restarted
          register: r_u663_restart
          failed_when: false
          when:
            - (r_u663_line.changed | default(false)) | bool
            - (r_u663_reload.failed | default(false)) | bool

        - name: "U_66_3 | compute"
          ansible.builtin.set_fact:
            u66_status: "{{ (((r_u663_dir.failed | default(false)) | bool) or ((r_u663_line.failed | default(false)) | bool)) | ternary(0, 2) }}"
            u66_desc: >-
              {{
                (((r_u663_dir.failed | default(false)) | bool) or ((r_u663_line.failed | default(false)) | bool))
                | ternary(
                    "messages 로그 정책(*.info… → /var/log/messages) 반영에 실패하여 수동조치로 전환했습니다",
                    "messages 로그 정책(*.info… → /var/log/messages)을 반영했습니다"
                  )
              }}
            u66_result: "{{ ((u66_status | int) == 2) | ternary('조치 성공 (status: 2)', '조치 불가 (status: 0)') }}"
          changed_when: false

        - name: "U_66_3 | emit stderr log JSON"
          delegate_to: localhost
          become: false
          ansible.builtin.shell: |
            printf '%s\n' '{{ {
              "ts": (ts_e | default("")),
              "flag_id": "U_66_3",
              "section": "일반 로그를 /var/log/messages로 기록하도록 rsyslog 정책(drop-in) 반영",
              "title": "[U_66_3] messages(*.info) 로그 정책 설정",
              "cmd": u66_cmd,
              "result": u66_result
            } | to_json }}' \
            | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin), ensure_ascii=False))' \
            | tee -a '{{ my_log_file }}' 1>&2
          vars:
            ts_e: "{{ lookup('pipe', TS_STDERR_CMD) }}"
          changed_when: false

        - name: "U_66_3 | emit stdout result JSON"
          delegate_to: localhost
          become: false
          ansible.builtin.shell: |
            printf '%s\n' '{{ {
              "meta": {"hostname": META_HOSTNAME, "ip": META_IP, "user": META_USER},
              "result": {
                "flag_id": "U_66_3",
                "status": (u66_status | int),
                "description": (u66_desc | string),
                "category": "log",
                "timestamp": (ts_o | default(""))
              }
            } | to_json }}' \
            | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin), ensure_ascii=False))' \
            | tee -a '{{ my_json_file }}'
          vars:
            ts_o: "{{ lookup('pipe', TS_STDOUT_CMD) }}"
          changed_when: false
      when:
        - "'U_66_3' in (flag_list | default([]))"

    # =========================================================
    # U_66_4 : cron.* -> /var/log/cron
    # =========================================================
    - name: "U_66 | [U_66_4] cron policy + logs/json"
      block:
        - name: "U_66_4 | cmd"
          ansible.builtin.set_fact:
            u66_cmd: "ensure cron.* -> /var/log/cron (drop-in); systemctl reload rsyslog (fallback restart)"
          changed_when: false

        - name: "U_66_4 | ensure drop-in dir"
          ansible.builtin.file:
            path: "{{ rsyslog_dropin_dir }}"
