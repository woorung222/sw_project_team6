        - name: "U_66_4 | emit stderr log JSON"
          delegate_to: localhost
          become: false
          ansible.builtin.shell: |
            printf '%s\n' '{{ {
              "ts": (ts_e | default("")),
              "flag_id": "U_66_4",
              "section": "cron 로그를 /var/log/cron으로 기록하도록 rsyslog 정책(drop-in) 반영",
              "title": "[U_66_4] cron 로그 정책 설정",
              "cmd": u66_cmd,
              "result": u66_result
            } | to_json }}' \
            | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin), ensure_ascii=False))' \
            | tee -a '{{ my_log_file }}' 1>&2
          vars:
            ts_e: "{{ lookup('pipe', TS_STDERR_CMD) }}"
          changed_when: false

        - name: "U_66_4 | emit stdout result JSON"
          delegate_to: localhost
          become: false
          ansible.builtin.shell: |
            printf '%s\n' '{{ {
              "meta": {"hostname": META_HOSTNAME, "ip": META_IP, "user": META_USER},
              "result": {
                "flag_id": "U_66_4",
                "status": (u66_status | int),
                "description": (u66_desc | string),
                "category": "log",
                "timestamp": (ts_o | default(""))
              }
            } | to_json }}' \
            | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin), ensure_ascii=False))' \
            | tee -a '{{ my_json_file }}'
