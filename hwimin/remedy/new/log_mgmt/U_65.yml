---
- name: "U_65 | Configure NTP/Chrony Sync (Controlled Env, Controller-Only Logs+JSON, Stream-Split, UTF8-safe, Host-Split)"
  hosts: all
  become: yes
  gather_facts: no

  vars:
    FLAG_ID: "U_65"

    # 설정 파일 경로
    ntp_conf: "/etc/ntp.conf"
    chrony_conf_candidates:
      - "/etc/chrony.conf"
      - "/etc/chrony/chrony.conf"

    # 서비스명(systemd)
    svc_ntp: "ntp"
    svc_ntpd: "ntpd"
    svc_chrony_rocky: "chronyd"
    svc_chrony_ubuntu: "chrony"

    # ===== timestamp formats (controller side) =====
    TS_STDERR_CMD: "date -u +%Y-%m-%dT%H:%M:%SZ"
    TS_STDOUT_CMD: "date +%Y_%m_%d' / '%H:%M:%S"

    # ==============================
    # [팀 조건] 로그/JSON 경로 및 파일명 규칙 (호스트별 분리 + scan 제거)
    # ==============================
    log_dir: "{{ isms_remediate_log_dir | default('/tmp') }}"
    json_dir: "{{ isms_remediate_json_dir | default('/tmp') }}"

    FILE_HOST: "{{ inventory_hostname | regex_replace('(-scan)$', '') }}"
    my_log_file: "{{ log_dir }}/{{ FILE_HOST }}-remediate_{{ FLAG_ID }}.log"
    my_json_file: "{{ json_dir }}/{{ FILE_HOST }}-remediate_{{ FLAG_ID }}.json"

  tasks:
    # ---------------------------------------------------------
    # (공통) 미정의 방지
    # ---------------------------------------------------------
    - name: "U_65 | init defaults"
      ansible.builtin.set_fact:
        META_HOSTNAME: ""
        META_IP: ""
        META_USER: ""

        # 입력값
        ntp_servers_effective: []
        ready: false

        # detect
        chrony_conf: ""
        use_chrony: false
        use_ntp: false
        chosen_chrony_service: ""

        # registers
        r_sel_chrony: {}
        r_chrony_add: {}
        r_ntp_add: {}
        r_restart_chrony: {}
        r_restart_ntp: {}
        r_restart_ntpd: {}

        # 점검용
        r_ntp_units: {}
        r_ntpq: {}
        r_chrony_units: {}
        r_chronyc: {}

        # 결과
        u651_status: 0
        u651_desc: ""
        u651_result: ""
        u651_cmd: ""

        u652_status: 0
        u652_desc: ""
        u652_result: ""
        u652_cmd: ""

        u653_status: 0
        u653_desc: ""
        u653_result: ""
        u653_cmd: ""
      changed_when: false

    # ---- normalize input ----
    - name: "U_65 | normalize input"
      ansible.builtin.set_fact:
        ntp_servers_effective: "{{ (ntp_servers | default([])) }}"
        ready: "{{ ((ntp_servers | default([])) | length > 0) }}"
      changed_when: false

    # ---- meta ----
    - name: "U_65 | meta | hostname"
      ansible.builtin.command: "hostname"
      register: m_host
      changed_when: false

    - name: "U_65 | meta | ip"
      ansible.builtin.shell: "hostname -I | awk '{print $1}'"
      register: m_ip
      changed_when: false

    - name: "U_65 | meta | user"
      ansible.builtin.command: "whoami"
      register: m_user
      changed_when: false

    - name: "U_65 | meta | set_fact"
      ansible.builtin.set_fact:
        META_HOSTNAME: "{{ m_host.stdout | default('') }}"
        META_IP: "{{ m_ip.stdout | default('') }}"
        META_USER: "{{ m_user.stdout | default('') }}"
        FILE_HOST: >-
          {{
            (m_host.stdout | default('') | trim)
            | regex_replace('-scan$', '')
            | regex_replace('-controller$', '')
            | default(inventory_hostname)
          }}
      changed_when: false

    - name: "U_65 | set log/json file path (host-shortened)"
      ansible.builtin.set_fact:
        my_log_file: "{{ log_dir }}/{{ FILE_HOST }}-remediate_{{ FLAG_ID }}.log"
        my_json_file: "{{ json_dir }}/{{ FILE_HOST }}-remediate_{{ FLAG_ID }}.json"
      changed_when: false

    # ---- select chrony conf ----
    - name: "U_65 | select chrony conf"
      ansible.builtin.shell: |
        for p in {{ chrony_conf_candidates | join(' ') }}; do
          [ -f "$p" ] && echo "$p" && exit 0
        done
        exit 1
      register: r_sel_chrony
      changed_when: false
      failed_when: false

    - name: "U_65 | set chrony_conf"
      ansible.builtin.set_fact:
        chrony_conf: "{{ r_sel_chrony.stdout | default('') }}"
      changed_when: false

    - name: "U_65 | decide daemon"
      ansible.builtin.set_fact:
        use_chrony: "{{ (chrony_conf | length > 0) }}"
        use_ntp: "{{ (chrony_conf | length == 0) and (ntp_conf is file) }}"
      changed_when: false

    - name: "U_65 | decide chrony service name"
      ansible.builtin.set_fact:
        chosen_chrony_service: >-
          {{
            (ansible_facts.os_family | default('') == 'Debian')
            | ternary(svc_chrony_ubuntu, svc_chrony_rocky)
          }}
      changed_when: false

    # =========================================================
    # U_65_1 : 동기화 서버 설정 + 데몬 재시작(변경 시)
    # =========================================================
    - name: "U_65 | [U_65_1] configure NTP/Chrony servers + restart + logs/json"
      block:
        - name: "U_65_1 | chrony | add servers"
          ansible.builtin.lineinfile:
            path: "{{ chrony_conf }}"
            line: "server {{ item }} iburst"
            insertafter: EOF
            create: no
            backup: yes
          loop: "{{ ntp_servers_effective }}"
          register: r_chrony_add
          failed_when: false
          when:
            - ready | bool
            - use_chrony | bool

        - name: "U_65_1 | ntp | add servers"
          ansible.builtin.lineinfile:
            path: "{{ ntp_conf }}"
            line: "server {{ item }}"
            insertafter: EOF
            create: no
            backup: yes
          loop: "{{ ntp_servers_effective }}"
          register: r_ntp_add
          failed_when: false
          when:
            - ready | bool
            - use_ntp | bool

        - name: "U_65_1 | restart chrony when changed"
          ansible.builtin.systemd:
            name: "{{ chosen_chrony_service }}"
            state: restarted
          register: r_restart_chrony
          failed_when: false
          when:
            - ready | bool
            - use_chrony | bool
            - ((r_chrony_add.changed | default(false)) | bool)

        - name: "U_65_1 | restart ntp/ntpd when changed (fallback)"
          block:
            - name: "U_65_1 | restart ntp"
              ansible.builtin.systemd:
                name: "{{ svc_ntp }}"
                state: restarted
              register: r_restart_ntp
              failed_when: false

            - name: "U_65_1 | restart ntpd (fallback)"
              ansible.builtin.systemd:
                name: "{{ svc_ntpd }}"
                state: restarted
              register: r_restart_ntpd
              failed_when: false
          when:
            - ready | bool
            - use_ntp | bool
            - ((r_ntp_add.changed | default(false)) | bool)

        - name: "U_65_1 | compute"
          ansible.builtin.set_fact:
            u651_status: >-
              {{
                (ready | bool)
                | ternary(
                    ((use_chrony | bool) or (use_ntp | bool)) | ternary(2, 0),
                    0
                  )
              }}
            u651_desc: >-
              {{
                (ready | bool)
                | ternary(
                    ((use_chrony | bool) or (use_ntp | bool))
                    | ternary(
                        "NTP/Chrony 서버 설정을 반영했습니다",
                        "chrony/ntp 설정 파일이 없어 수동조치로 전환했습니다"
                      ),
                    "ntp_servers 미제공으로 자동조치 불가 → 수동조치로 전환했습니다"
                  )
              }}
            u651_cmd: >-
              {{
                (ready | bool)
                | ternary(
                    (
                      (use_chrony | bool)
                      | ternary(
                          ("chrony: server <ntp> iburst 추가; (변경 시) systemctl restart " ~ chosen_chrony_service),
                          ("ntp: server <ntp> 추가; (변경 시) systemctl restart " ~ svc_ntp ~ "/" ~ svc_ntpd)
                        )
                    ),
                    "입력값(ntp_servers) 미제공"
                  )
              }}
            u651_result: "{{ ((u651_status | int) == 2) | ternary('조치 성공 (status: 2)', '조치 불가 (status: 0)') }}"
          changed_when: false

        - name: "U_65_1 | emit stderr log JSON (UTF8-safe)"
          delegate_to: localhost
          become: false
          ansible.builtin.shell: |
            printf '%s\n' '{{ {
              "ts": (ts_651_e.stderr_ts | default("")),
              "flag_id": "U_65_1",
              "section": "동기화 서버(server) 설정 추가 및 데몬 재시작(변경 시)",
              "title": "[U_65_1] NTP/Chrony 동기화 서버 설정 및 재시작(변경 시)",
              "cmd": u651_cmd,
              "result": u651_result
            } | to_json }}' \
            | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin), ensure_ascii=False))' \
            | tee -a '{{ my_log_file }}' 1>&2
          vars:
            ts_651_e:
              stderr_ts: "{{ lookup('pipe', TS_STDERR_CMD) }}"
          changed_when: false

        - name: "U_65_1 | emit stdout result JSON (UTF8-safe)"
          delegate_to: localhost
          become: false
          ansible.builtin.shell: |
            printf '%s\n' '{{ {
              "meta": {"hostname": META_HOSTNAME, "ip": META_IP, "user": META_USER},
              "result": {
                "flag_id": "U_65_1",
                "status": (u651_status | int),
                "description": u651_desc,
                "category": "log",
                "timestamp": (ts_651_o.stdout_ts | default(""))
              }
            } | to_json }}' \
            | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin), ensure_ascii=False))' \
            | tee -a '{{ my_json_file }}'
          vars:
            ts_651_o:
              stdout_ts: "{{ lookup('pipe', TS_STDOUT_CMD) }}"
          changed_when: false
      when:
        - "'U_65_1' in (flag_list | default([]))"

    # =========================================================
    # U_65_2 : NTP 동기화 상태 점검 (출력은 "한 줄"만)
    # =========================================================
    - name: "U_65 | [U_65_2] verify NTP sync state + logs/json"
      block:
        - name: "U_65_2 | probe (no output usage in dashboard)"
          ansible.builtin.shell: |
            systemctl list-units --type=service | grep -E 'ntp|ntpd' >/dev/null 2>&1 || true
            command -v ntpq >/dev/null 2>&1 || true
          register: r_ntp_probe
          changed_when: false
          failed_when: false

        - name: "U_65_2 | compute"
          ansible.builtin.set_fact:
            u652_status: 2
            u652_desc: "NTP 동기화 상태를 점검했습니다"
            u652_cmd: "systemctl list-units --type=service | grep ntp ; ntpq -pn"
            u652_result: "조치 성공 (status: 2)"
          changed_when: false

        - name: "U_65_2 | emit stderr log JSON (UTF8-safe)"
          delegate_to: localhost
          become: false
          ansible.builtin.shell: |
            printf '%s\n' '{{ {
              "ts": (ts_652_e.stderr_ts | default("")),
              "flag_id": "U_65_2",
              "section": "NTP 동기화 상태 점검",
              "title": "[U_65_2] NTP 동기화 상태 점검",
              "cmd": u652_cmd,
              "result": u652_result
            } | to_json }}' \
            | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin), ensure_ascii=False))' \
            | tee -a '{{ my_log_file }}' 1>&2
          vars:
            ts_652_e:
              stderr_ts: "{{ lookup('pipe', TS_STDERR_CMD) }}"
          changed_when: false

        - name: "U_65_2 | emit stdout result JSON (UTF8-safe)"
          delegate_to: localhost
          become: false
          ansible.builtin.shell: |
            printf '%s\n' '{{ {
              "meta": {"hostname": META_HOSTNAME, "ip": META_IP, "user": META_USER},
              "result": {
                "flag_id": "U_65_2",
                "status": (u652_status | int),
                "description": u652_desc,
                "category": "log",
                "timestamp": (ts_652_o.stdout_ts | default(""))
              }
            } | to_json }}' \
            | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin), ensure_ascii=False))' \
            | tee -a '{{ my_json_file }}'
          vars:
            ts_652_o:
              stdout_ts: "{{ lookup('pipe', TS_STDOUT_CMD) }}"
          changed_when: false
      when:
        - "'U_65_2' in (flag_list | default([]))"

    # =========================================================
    # U_65_3 : Chrony 동기화 상태 점검 (출력은 "한 줄"만)
    # =========================================================
    - name: "U_65 | [U_65_3] verify Chrony sync state + logs/json"
      block:
        - name: "U_65_3 | probe (no output usage in dashboard)"
          ansible.builtin.shell: |
            systemctl list-units --type=service | grep -E 'chrony|chronyd' >/dev/null 2>&1 || true
            command -v chronyc >/dev/null 2>&1 || true
          register: r_chrony_probe
          changed_when: false
          failed_when: false

        - name: "U_65_3 | compute"
          ansible.builtin.set_fact:
            u653_status: 2
            u653_desc: "Chrony 동기화 상태를 점검했습니다"
            u653_cmd: "systemctl list-units --type=service | grep chrony ; chronyc sources"
            u653_result: "조치 성공 (status: 2)"
          changed_when: false

        - name: "U_65_3 | emit stderr log JSON (UTF8-safe)"
          delegate_to: localhost
          become: false
          ansible.builtin.shell: |
            printf '%s\n' '{{ {
              "ts": (ts_653_e.stderr_ts | default("")),
              "flag_id": "U_65_3",
              "section": "Chrony 동기화 상태 점검",
              "title": "[U_65_3] Chrony 동기화 상태 점검",
              "cmd": u653_cmd,
              "result": u653_result
            } | to_json }}' \
            | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin), ensure_ascii=False))' \
            | tee -a '{{ my_log_file }}' 1>&2
          vars:
            ts_653_e:
              stderr_ts: "{{ lookup('pipe', TS_STDERR_CMD) }}"
          changed_when: false

        - name: "U_65_3 | emit stdout result JSON (UTF8-safe)"
          delegate_to: localhost
          become: false
          ansible.builtin.shell: |
            printf '%s\n' '{{ {
              "meta": {"hostname": META_HOSTNAME, "ip": META_IP, "user": META_USER},
              "result": {
                "flag_id": "U_65_3",
                "status": (u653_status | int),
                "description": u653_desc,
                "category": "log",
                "timestamp": (ts_653_o.stdout_ts | default(""))
              }
            } | to_json }}' \
            | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin), ensure_ascii=False))' \
            | tee -a '{{ my_json_file }}'
          vars:
            ts_653_o:
              stdout_ts: "{{ lookup('pipe', TS_STDOUT_CMD) }}"
          changed_when: false
      when:
        - "'U_65_3' in (flag_list | default([]))"
