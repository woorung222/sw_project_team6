---
- name: "U_64 | Patch Management Policy (Controlled Env, Controller-Only Logs+JSON, Stream-Split, UTF8-safe, Host-Split)"
  hosts: all
  become: yes
  gather_facts: no

  vars:
    FLAG_ID: "U_64"

    TS_STDERR_CMD: "date -u +%Y-%m-%dT%H:%M:%SZ"
    TS_STDOUT_CMD: "date +%Y_%m_%d' / '%H:%M:%S"

    log_dir: "{{ isms_remediate_log_dir | default('/tmp') }}"
    json_dir: "{{ isms_remediate_json_dir | default('/tmp') }}"

    FILE_HOST: "{{ inventory_hostname | regex_replace('(-scan)$', '') }}"
    my_log_file: "{{ log_dir }}/{{ FILE_HOST }}-remediate_{{ FLAG_ID }}.log"
    my_json_file: "{{ json_dir }}/{{ FILE_HOST }}-remediate_{{ FLAG_ID }}.json"

  tasks:
    - name: "U_64 | init defaults"
      ansible.builtin.set_fact:
        META_HOSTNAME: ""
        META_IP: ""
        META_USER: ""

        OS_PRETTY: ""
        KERNEL_VER: ""

        # U_64_1
        u641_status: 0
        u641_desc: ""
        u641_result: ""
        u641_cmd: ""

        # U_64_2
        u642_status: 0
        u642_desc: ""
        u642_result: ""
        u642_cmd: ""

        # U_64_2 probe internal (출력용 아님)
        u642_probe: ""
        u642_cur_kernel: ""
        u642_latest_kernel: ""
        U64_REBOOT_REQUIRED: "unknown"
      changed_when: false

    # ---------------- meta ----------------
    - name: "U_64 | meta | hostname"
      ansible.builtin.command: "hostname"
      register: m_host
      changed_when: false

    - name: "U_64 | meta | ip"
      ansible.builtin.shell: "hostname -I | awk '{print $1}'"
      register: m_ip
      changed_when: false

    - name: "U_64 | meta | user"
      ansible.builtin.command: "whoami"
      register: m_user
      changed_when: false

    - name: "U_64 | meta | set_fact"
      ansible.builtin.set_fact:
        META_HOSTNAME: "{{ m_host.stdout | default('') }}"
        META_IP: "{{ m_ip.stdout | default('') }}"
        META_USER: "{{ m_user.stdout | default('') }}"
      changed_when: false

    # ------------- OS/Kernel info -------------
    - name: "U_64 | collect os pretty name"
      ansible.builtin.shell: |
        if [ -r /etc/os-release ]; then
          . /etc/os-release
          echo "${PRETTY_NAME:-}"
        else
          echo ""
        fi
      register: r_os
      changed_when: false
      failed_when: false

    - name: "U_64 | collect kernel version"
      ansible.builtin.command: "uname -r"
      register: r_kernel
      changed_when: false
      failed_when: false

    - name: "U_64 | set collected facts"
      ansible.builtin.set_fact:
        OS_PRETTY: "{{ r_os.stdout | default('') }}"
        KERNEL_VER: "{{ r_kernel.stdout | default('') }}"
      changed_when: false

    # =========================================================
    # U_64_1
    # =========================================================
    - name: "U_64 | [U_64_1] patch policy -> manual handoff + logs/json"
      block:
        - name: "U_64_1 | compute"
          ansible.builtin.set_fact:
            u641_status: 2
            u641_desc: "OS/Kernel 현황을 수집하고, 보안패치 적용은 운영정책에 따라 수동조치로 전환했습니다"
            u641_result: "조치 성공 (status: 2)"
            u641_cmd: "cat /etc/os-release; uname -r"
          changed_when: false

        - name: "U_64_1 | emit stderr log JSON (UTF8-safe)"
          delegate_to: localhost
          become: false
          ansible.builtin.shell: |
            printf '%s\n' '{{ {
              "ts": (ts_641_e.stderr_ts | default("")),
              "flag_id": "U_64_1",
              "section": "OS/Kernel 현황 수집 및 보안패치 적용 수동조치 전환(장애 0 정책)",
              "title": "[U_64_1] 주기적 보안패치/벤더 권고 적용(수동조치 전환)",
              "cmd": u641_cmd,
              "result": u641_result
            } | to_json }}' \
            | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin), ensure_ascii=False))' \
            | tee -a '{{ my_log_file }}' 1>&2
          vars:
            ts_641_e:
              stderr_ts: "{{ lookup('pipe', TS_STDERR_CMD) }}"
          changed_when: false

        - name: "U_64_1 | emit stdout result JSON (UTF8-safe)"
          delegate_to: localhost
          become: false
          ansible.builtin.shell: |
            printf '%s\n' '{{ {
              "meta": {"hostname": META_HOSTNAME, "ip": META_IP, "user": META_USER},
              "result": {
                "flag_id": "U_64_1",
                "status": (u641_status | int),
                "description": (u641_desc | string),
                "category": "patch",
                "timestamp": (ts_641_o.stdout_ts | default(""))
              }
            } | to_json }}' \
            | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin), ensure_ascii=False))' \
            | tee -a '{{ my_json_file }}'
          vars:
            ts_641_o:
              stdout_ts: "{{ lookup('pipe', TS_STDOUT_CMD) }}"
          changed_when: false
      when:
        - "'U_64_1' in (flag_list | default([]))"

    # =========================================================
    # U_64_2
    # =========================================================
    - name: "U_64 | [U_64_2] kernel reboot-required check -> manual handoff + logs/json"
      block:
        - name: "U_64_2 | probe reboot-required indicators (best-effort)"
          ansible.builtin.shell: |
            CUR="$(uname -r 2>/dev/null || true)"

            # Ubuntu: /var/run/reboot-required 존재 여부
            if [ -d /etc/update-manager ] || command -v apt >/dev/null 2>&1; then
              if [ -f /var/run/reboot-required ]; then
                echo "ubuntu:reboot-required:yes"
              else
                echo "ubuntu:reboot-required:no"
              fi
              echo "$CUR"
              exit 0
            fi

            # Rocky/RHEL: needs-restarting -r (0=no, 1=yes)
            if command -v needs-restarting >/dev/null 2>&1; then
              needs-restarting -r >/dev/null 2>&1
              rc=$?
              if [ "$rc" = "1" ]; then
                echo "rocky:needs-restarting:yes"
              elif [ "$rc" = "0" ]; then
                echo "rocky:needs-restarting:no"
              else
                echo "rocky:needs-restarting:unknown"
              fi
              echo "$CUR"
              exit 0
            fi

            # fallback: 커널 패키지 비교(가능 시)
            if command -v rpm >/dev/null 2>&1; then
              LATEST="$(rpm -q kernel --qf '%{VERSION}-%{RELEASE}.%{ARCH}\n' 2>/dev/null | sort -V | tail -n 1 || true)"
              echo "rpm:kernel-compare:${LATEST:-unknown}"
              echo "$CUR"
              exit 0
            fi

            if command -v dpkg >/dev/null 2>&1; then
              LATEST="$(dpkg -l 2>/dev/null | awk '/^ii/ && $2 ~ /^linux-image-[0-9]/ {print $2}' | sort -V | tail -n 1 || true)"
              echo "dpkg:kernel-compare:${LATEST:-unknown}"
              echo "$CUR"
              exit 0
            fi

            echo "unknown:unknown"
            echo "$CUR"
          register: r_u642_probe
          changed_when: false
          failed_when: false

        - name: "U_64_2 | normalize reboot status (internal only)"
          ansible.builtin.set_fact:
            u642_probe: "{{ (r_u642_probe.stdout_lines[0] | default('unknown:unknown')) | string }}"
            u642_cur_kernel: "{{ (r_u642_probe.stdout_lines[1] | default(KERNEL_VER | default(''))) | string }}"
            u642_latest_kernel: >-
              {{
                ( (r_u642_probe.stdout_lines[0] | default('')) | regex_replace('^(rpm|dpkg):kernel-compare:', '') )
                if ((r_u642_probe.stdout_lines[0] | default('')) is match('^(rpm|dpkg):kernel-compare:'))
                else ''
              }}
            U64_REBOOT_REQUIRED: >-
              {{
                'yes' if (u642_probe in ['ubuntu:reboot-required:yes','rocky:needs-restarting:yes']) else
                'no'  if (u642_probe in ['ubuntu:reboot-required:no','rocky:needs-restarting:no']) else
                'unknown'
              }}
          changed_when: false

        - name: "U_64_2 | compute friendly outputs (NO boolean / NO details)"
          ansible.builtin.set_fact:
            u642_cmd: "uname -r; reboot-required/needs-restarting 점검"
            u642_status: 2
            u642_desc: >-
              {{
                (U64_REBOOT_REQUIRED == 'yes')
                | ternary(
                    "커널 패치 반영을 위해 재부팅이 필요하여 운영정책(장애 0)에 따라 수동조치로 전환했습니다",
                    (U64_REBOOT_REQUIRED == 'no')
                    | ternary(
                        "현재 커널 상태 기준 재부팅이 필요하지 않습니다(정기 점검으로 관리)",
                        "재부팅 필요 여부를 자동으로 확정할 수 없어 수동 점검으로 전환했습니다"
                      )
                  )
              }}
            u642_result: >-
              {{
                ((u642_status | int) == 2)
                | ternary("조치 성공 (status: 2)", "조치 불가 (status: 0)")
              }}
          changed_when: false

        - name: "U_64_2 | emit stderr log JSON (UTF8-safe) - result fixed format"
          delegate_to: localhost
          become: false
          ansible.builtin.shell: |
            printf '%s\n' '{{ {
              "ts": (ts_642_e.stderr_ts | default("")),
              "flag_id": "U_64_2",
              "section": "커널 최신 패치 적용 후 재부팅 필요 여부 점검 및 수동조치 전환 기록",
              "title": "[U_64_2] 커널 패치 반영(재부팅 필요 여부) 점검",
              "cmd": u642_cmd,
              "result": u642_result
            } | to_json }}' \
            | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin), ensure_ascii=False))' \
            | tee -a '{{ my_log_file }}' 1>&2
          vars:
            ts_642_e:
              stderr_ts: "{{ lookup('pipe', TS_STDERR_CMD) }}"
          changed_when: false

        - name: "U_64_2 | emit stdout result JSON (UTF8-safe) - description is single-line string"
          delegate_to: localhost
          become: false
          ansible.builtin.shell: |
            printf '%s\n' '{{ {
              "meta": {"hostname": META_HOSTNAME, "ip": META_IP, "user": META_USER},
              "result": {
                "flag_id": "U_64_2",
                "status": (u642_status | int),
                "description": (u642_desc | string),
                "category": "patch",
                "timestamp": (ts_642_o.stdout_ts | default(""))
              }
            } | to_json }}' \
            | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin), ensure_ascii=False))' \
            | tee -a '{{ my_json_file }}'
          vars:
            ts_642_o:
              stdout_ts: "{{ lookup('pipe', TS_STDOUT_CMD) }}"
          changed_when: false
      when:
        - "'U_64_2' in (flag_list | default([]))"
